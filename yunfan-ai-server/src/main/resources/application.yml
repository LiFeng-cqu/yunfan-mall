server:
  port: 40002

spring:
  application:
    name: yunfan-ai-server

  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    sentinel:
      transport:
        dashboard: localhost:8080

  redis:
    port: 6379
    host: 192.168.168.101

  session:
    store-type: redis

#开启feign对sentinel的支持
feign:
  sentinel:
    enabled: true

#暴露所有端点
management:
  endpoints:
    web:
      exposure:
        include: '*'

# ===== AI（DeepSeek）=====
# Key 不落库：环境变量 DEEPSEEK_API_KEY 注入，或由 Nacos/本地覆盖。
yunfan:
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: 30
