server:
  port: 12001

spring:
  application:
    name: yunfan-search
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848

    sentinel:
      transport:
        #配置sentinel dashboard地址
        dashboard: localhost:8080

  redis:
    host: 192.168.168.101
    port: 6379

#开启feign对sentinel的支持
feign:
  sentinel:
    enabled: true

  thymeleaf:
    cache: false

  session:
    store-type: redis

logging:
  level:
    com.yunfan.mall.search: debug
    root: warn
  pattern:
    console: "%d{yyyy-MM-dd} [%thread] - %msg%n"

#暴露所有端点
management:
  endpoints:
    web:
      exposure:
        include: '*'

# ===== AI 自然语言检索（DeepSeek）=====
# API Key 绝不写进代码库：通过环境变量注入（或配置中心私有配置）。
# 未配置 Key 时 /ai/search 会返回明确错误提示，不影响既有普通检索。
yunfan:
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      timeout-seconds: 30
